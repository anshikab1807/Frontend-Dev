<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="responsive-image-gallery.css">
</head>
<body>
  <header>
    <h1>Image Filter Gallery</h1>
  </header>
  <main class="gallery">
    <figure><img src="img1.jpg" alt="Image 1"><figcaption>Blur</figcaption></figure>
    <figure><img src="img2.jpg" alt="Image 2"><figcaption>Grayscale</figcaption></figure>
    <figure><img src="img3.jpg" alt="Image 3"><figcaption>Sepia</figcaption></figure>
    <figure><img src="img4.jpg" alt="Image 4"><figcaption>Brightness</figcaption></figure>
    <figure><img src="img5.jpg" alt="Image 5"><figcaption>Contrast</figcaption></figure>
    <figure><img src="img6.jpg" alt="Image 6"><figcaption>Hue Rotate</figcaption></figure>
  </main>
</body>
</html>
