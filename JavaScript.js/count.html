<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="counter.css">
</head>

<body>
    <div class="box">
        <div class="part1">
            <h1>Counter</h1>
        </div>

        <div class="part2">
            <div class="display" id="display">0</div>
        </div>

        <div class="part3">
            <button class="increase" onclick= "decrease()">increment</button>
            <button class="+2" onclick= "add()" >+2</button>
            <button class="decrease" onclick= "increase()">decrement</button>
        </div>
        <script src="counter.js"></script>
    </div>
</body>
</html>
