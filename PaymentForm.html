<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form</title>
</head>
<body>
    <form action="#">
        <label for="CardHolderName">CardHolderName : </label>
        <input type="text" id="CardHolderName" placeholder="Enter your name" required> <br><br>
        <label for="CardNumber">Card Number : </label>
        <input type="text" id="CardNumber" placeholder="Enter your card number" required> <br><br>
        <label for="ExpiryDate">Expiry Date : </label>
        <input type="month" id="ExpiryDate" required> <br><br>  
        <label for="CVV">CVV : </label>
        <input type="file" id="CVV" required> <br><br>  
        <button>Pay Now</button>
    </form>
</body>
</html>
