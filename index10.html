<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Complete Layout</title>
  <link rel="stylesheet" href="style10.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <div class="logo">Brand</div>
      <ul class="nav-links">
        <li><a href="#">Home</a></li><li><a href="#">About</a></li><li><a href="#">Services</a></li><li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>
  <section class="hero">
    <div class="hero-inner">
      <h1>Welcome to Our Site</h1>
      <p>Delivering beautifully aligned interfaces with strong foundations.</p>
    </div>
  </section>
  <section class="about">
    <div class="about-inner">
      <div class="about-text">
        <h2>About Us</h2>
        <p>We blend design and engineering to build reliable products.</p>
      </div>
      <div class="about-image"><img src="https://via.placeholder.com/420x300" alt="About image"></div>
    </div>
  </section>
  <section class="services">
    <h2>Services</h2>
    <div class="service-row">
      <div class="service">Service A</div>
      <div class="service">Service B</div>
      <div class="service">Service C</div>
    </div>
  </section>
  <section id="contact" class="contact">
    <h2>Contact</h2>
    <form class="simple-form">
      <input type="text" placeholder="Name"><input type="email" placeholder="Email">
      <textarea placeholder="Message"></textarea>
      <button type="submit">Send</button>
    </form>
  </section>
  <footer class="site-footer">
    <p>&copy; 2025 Brand. All rights reserved.</p>
  </footer>
</body>
</html>
