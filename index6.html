<!doctype html>
<html lang="en">
<head>

  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="gallery-wrap">
    <h1>Photo Gallery</h1>
    <section class="gallery">
      <figure class="photo"><img src="https://via.placeholder.com/600x400?text=1" alt=""><figcaption>Caption One</figcaption></figure>
      <figure class="photo"><img src="https://via.placeholder.com/600x400?text=2" alt=""><figcaption>Caption Two</figcaption></figure>
      <figure class="photo"><img src="https://via.placeholder.com/600x400?text=3" alt=""><figcaption>Caption Three</figcaption></figure>
      <figure class="photo"><img src="https://via.placeholder.com/600x400?text=4" alt=""><figcaption>Caption Four</figcaption></figure>
      <figure class="photo"><img src="https://via.placeholder.com/600x400?text=5" alt=""><figcaption>Caption Five</figcaption></figure>
      <figure class="photo"><img src="https://via.placeholder.com/600x400?text=6" alt=""><figcaption>Caption Six</figcaption></figure>
    </section>
  </main>
</body>
</html>
