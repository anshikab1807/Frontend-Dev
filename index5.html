<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pricing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="pricing">
    <h1>Plans</h1>
    <section class="plans">
      <div class="plan">
        <h2>Basic</h2>
        <ul>
          <li>1 Project</li>
          <li>5 GB Storage</li>
          <li>Email Support</li>
        </ul>
        <div class="price">₹299</div>
        <a class="btn" href="#">Choose</a>
      </div>
      <div class="plan popular">
        <h2>Standard</h2>
        <ul>
          <li>5 Projects</li>
          <li>50 GB Storage</li>
          <li>Priority Support</li>
        </ul>
        <div class="price">₹699</div>
        <a class="btn" href="#">Choose</a>
      </div>
      <div class="plan">
        <h2>Premium</h2>
        <ul>
          <li>Unlimited Projects</li>
          <li>200 GB Storage</li>
          <li>24/7 Support</li>
        </ul>
        <div class="price">₹1299</div>
        <a class="btn" href="#">Choose</a>
      </div>
    </section>
  </main>
</body>
</html>
